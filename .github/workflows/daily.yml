name: Cryptonary Report

on:
  workflow_dispatch: {}
  # Nessuno schedule automatico, di proposito: parte solo quando lo lanci tu
  # manualmente, per evitare di consumare credito API senza controllo.

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run report script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python scrape_and_report.py

      - name: Commit updated dashboard
        run: |
          git config user.name "cryptonary-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Push riuscito al tentativo $i."
              break
            fi
            echo "Push fallito al tentativo $i, riprovo tra 5 secondi..."
            sleep 5
          done

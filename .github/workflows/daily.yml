name: Cryptonary Daily Report

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run report script
        env:
          CRYPTONARY_REFRESH_TOKEN: ${{ secrets.CRYPTONARY_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python scrape_and_report.py

      - name: Commit updated dashboard
        run: |
          git config user.name "cryptonary-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

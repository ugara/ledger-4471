name: Cryptonary Report

on:
  schedule:
    # 01:00, 07:00, 13:00, 19:00 UTC — controllo rapido (prezzi/portafoglio/avvisi,
    # economico). L'analisi approfondita (costosa, con ricerca web) NON è più a
    # orario fisso: scatta solo quando richiesta dal pulsante sulla dashboard,
    # elaborata al primo controllo rapido successivo
    - cron: "0 1,7,13,19 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run report script
        env:
          CRYPTONARY_EMAIL: ${{ secrets.CRYPTONARY_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python scrape_and_report.py

      - name: Commit updated dashboard
        run: |
          git config user.name "cryptonary-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "Aggiornamento automatico $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Se nel frattempo qualcun altro ha aggiornato il repository (es. hai
          # caricato un file manualmente mentre il workflow girava), il push
          # verrebbe rifiutato: riproviamo con un pull --rebase prima di ogni
          # tentativo, fino a 3 volte.
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              echo "Push riuscito al tentativo $i."
              break
            fi
            echo "Push fallito al tentativo $i, riprovo tra 5 secondi..."
            sleep 5
          done
